<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Royal Indigo to Vivid Purple & Neon Magenta) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="25%" stop-color="#6366F1" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="90%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Chat Bubble Gloss Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- JK Text Gradient -->
    <linearGradient id="jkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="topRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#15082E" flood-opacity="0.5" />
    </filter>

    <!-- Lightning Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Full Bleed Background (Works for all launcher masks: round, squircle, pebble) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 2. Subtle ambient top curve highlight -->
  <path d="M 0 0 L 512 0 L 512 240 C 350 290 160 290 0 240 Z" fill="url(#topRim)" />

  <!-- 3. Safe Central Content: Elevated 3D Chat Bubble -->
  <g filter="url(#shadow)">
    <!-- Speech bubble body centered at (256, 240) -->
    <path d="M 120 120
             C 120 90, 145 66, 178 66
             L 334 66
             C 367 66, 392 90, 392 120
             L 392 284
             C 392 314, 367 338, 334 338
             L 220 338
             L 155 396
             C 142 408, 120 398, 120 380
             L 120 338
             Z"
          fill="url(#bubbleGrad)" />
  </g>

  <!-- 4. Chat Bubble Top Inner Highlight Edge -->
  <path d="M 145 88 L 367 88" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />

  <!-- 5. Dynamic Emblem: Centered Bold "JK" and High-Energy Lightning Bolt -->
  <g transform="translate(138, 102)">
    <!-- Letter J -->
    <path d="M 52 35
             L 52 118
             C 52 144, 34 158, 12 152
             C 1 150, -4 140, 2 131
             C 7 122, 16 123, 23 125
             C 32 128, 36 122, 36 112
             L 36 35
             C 36 27, 41 22, 47 22
             C 50 22, 52 27, 52 35 Z"
          fill="url(#jkGrad)" />

    <!-- Letter K -->
    <path d="M 134 32
             C 134 24, 140 19, 147 19
             C 154 19, 159 24, 159 32
             L 159 78
             L 194 38
             C 199 32, 208 32, 213 38
             C 218 43, 218 52, 213 57
             L 177 97
             L 219 148
             C 224 154, 222 163, 216 168
             C 210 173, 202 171, 197 165
             L 159 119
             L 159 157
             C 159 164, 154 169, 147 169
             C 140 169, 134 164, 134 157 Z"
          fill="url(#jkGrad)" />

    <!-- High-Voltage Electric Golden Lightning Bolt in Center -->
    <polygon points="106,8 68,92 110,92 84,176 154,76 112,76"
             fill="url(#boltGrad)"
             filter="url(#glow)"
             stroke="#FFFFFF"
             stroke-width="3"
             stroke-linejoin="round" />
  </g>

  <!-- 6. Playful energetic spark accents -->
  <circle cx="362" cy="100" r="7" fill="#FDE047" opacity="0.95" />
  <circle cx="378" cy="116" r="4" fill="#FDE047" opacity="0.8" />
  <circle cx="140" cy="275" r="5" fill="#818CF8" opacity="0.75" />
</svg>
